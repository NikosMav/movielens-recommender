[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movielens-recommender"
version = "0.1.0"
description = "Standalone MovieLens recommender: data/split/eval, classic baselines, two-tower retrieval, LambdaRank"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nikolaos Mavrapidis" }]
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "pandas==2.2.3",
    "implicit==0.7.3",
    "PyYAML==6.0.3",
    "matplotlib==3.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.2",
]
# Two-tower retrieval (S3b). Prefer the CPU wheel in CI / laptops:
#   pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
#   pip install -e ".[deep]"
deep = [
    "torch==2.6.0",
]
# LambdaRank (S4). Exact pin:
#   pip install -e ".[rank]"
rank = [
    "lightgbm==4.6.0",
]
# Streamlit demo (S5a). No training dependencies beyond rank + deep.
ui = [
    "streamlit==1.65.0",
]
# HTTP API (S5b, ADR-0014). httpx is for FastAPI's test client.
api = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "httpx==0.28.1",
]

[project.scripts]
movielens-recommender = "movielens_recommender.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
