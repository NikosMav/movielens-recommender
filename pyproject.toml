[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movielens-recommender"
version = "0.1.0"
description = "Standalone MovieLens recommender: data/split/eval + classic baselines + two-tower retrieval"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "movielens-recommender contributors" }]
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "pandas==2.2.3",
    "implicit==0.7.3",
    "PyYAML==6.0.3",
    "matplotlib==3.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.2",
]
# Two-tower retrieval (S3b). Prefer the CPU wheel in CI / laptops:
#   pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
#   pip install -e ".[deep]"
deep = [
    "torch==2.6.0",
]

[project.scripts]
movielens-recommender = "movielens_recommender.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
