[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movielens-recommender"
version = "0.1.0"
description = "Standalone MovieLens recommender: data/split/eval + classic baselines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "movielens-recommender contributors" }]
dependencies = [
    "numpy==2.4.4",
    "scipy==1.18.1",
    "pandas==3.0.6",
    "implicit==0.7.3",
    "PyYAML==6.0.3",
    "matplotlib==3.10.8",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[project.scripts]
movielens-recommender = "movielens_recommender.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
