# Locked from results/budget/ml-32m.json before any test metric (ADR-0011).
seed: 42
dataset: ml-32m
data_dir: data
results_dir: results
tune: true
split:
  min_ratings: 5
  test_fraction: 0.2
  val_fraction: 0.1
eval:
  ks:
  - 10
  - 20
  relevance_threshold: 4.0
  n_bootstrap: 1000
  bootstrap_alpha: 0.05
  retrieval_ks:
  - 100
  - 200
  # Locked with the memory measurements in ADR-0011, before test metrics.
  user_sample_size: 8000
  user_sample_seed: 42
models:
  als:
    factors: 64
    regularization: 0.01
    iterations: 15
    alpha: 40.0
  item_item_cosine:
    min_common: 1
    # k_neighbors=0 would allocate a dense 87k Gram. Sparse top-k is required.
    k_neighbors: 100
    shrinkage: 0.0
  ease:
    # Head-catalog size chosen from the allocation probe in ADR-0011.
    max_items: 12000
  two_tower:
    enabled: true
    embedding_dim: 64
    learning_rate: 0.003
    temperature: 0.1
    batch_size: 1024
    weight_decay: 0.0001
    max_epochs: 6
    patience: 2
    max_history: 50
    seeds:
    - 42
  ranker:
    enabled: true
    candidate_k: 200
    early_stop_fraction: 0.2
    num_boost_round: 200
    early_stopping_rounds: 30
    learning_rate: 0.05
    num_leaves: 31
    min_data_in_leaf: 20
    feature_fraction: 0.9
    bagging_fraction: 0.8
    seeds:
    - 42
    - 43
    - 44
    # ml-32M has no users.dat.
    demographics: "off"
global_cutoff:
  enabled: false
  timestamp_quantile: 0.8
  min_train_ratings: 5
tuning:
  als:
  - factors: 32
    regularization: 0.1
    alpha: 40.0
    iterations: 15
  - factors: 64
    regularization: 0.1
    alpha: 40.0
    iterations: 15
  - factors: 64
    regularization: 0.01
    alpha: 20.0
    iterations: 15
  item_item_cosine:
  - k_neighbors: 50
    shrinkage: 0.0
    min_common: 1
  - k_neighbors: 100
    shrinkage: 50.0
    min_common: 1
  - k_neighbors: 200
    shrinkage: 50.0
    min_common: 1
  ease:
  - l2: 500.0
  - l2: 2000.0
  - l2: 5000.0
  - l2: 10000.0
  rp3beta:
  - alpha: 0.5
    beta: 0.5
    top_k: 100
  - alpha: 1.0
    beta: 0.5
    top_k: 100
  - alpha: 0.5
    beta: 0.5
    top_k: 300
  - alpha: 1.0
    beta: 0.0
    top_k: 100
  two_tower:
  - embedding_dim: 64
    learning_rate: 0.001
    temperature: 0.1
    batch_size: 1024
    weight_decay: 0.0001
    max_epochs: 6
    patience: 2
    max_history: 50
  - embedding_dim: 64
    learning_rate: 0.003
    temperature: 0.1
    batch_size: 1024
    weight_decay: 0.0001
    max_epochs: 6
    patience: 2
    max_history: 50
