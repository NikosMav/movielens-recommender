seed: 42
dataset: ml-1m
data_dir: data
results_dir: results
tune: true
split:
  min_ratings: 5
  test_fraction: 0.2
  val_fraction: 0.1
eval:
  ks:
  - 10
  - 20
  relevance_threshold: 4.0
  n_bootstrap: 1000
  bootstrap_alpha: 0.05
  retrieval_ks:
  - 100
  - 200
models:
  als:
    factors: 64
    regularization: 0.01
    iterations: 15
    alpha: 40.0
  item_item_cosine:
    min_common: 1
    k_neighbors: 0
    shrinkage: 0.0
  two_tower:
    enabled: true
    embedding_dim: 64
    learning_rate: 0.001
    temperature: 0.1
    batch_size: 1024
    weight_decay: 0.0001
    max_epochs: 20
    patience: 3
    max_history: 50
    seeds:
    - 42
    - 43
    - 44
  ranker:
    enabled: true
    candidate_k: 200
    early_stop_fraction: 0.2
    num_boost_round: 200
    early_stopping_rounds: 30
    learning_rate: 0.05
    num_leaves: 31
    min_data_in_leaf: 20
    feature_fraction: 0.9
    bagging_fraction: 0.8
    seeds:
    - 42
    - 43
    - 44
    # S4b (ADR-0009). both is the default because the pre-registered rule passed
    # after the test run. off / raw / affinity remain available. ml-latest-small stays off.
    demographics: both
global_cutoff:
  enabled: true
  timestamp_quantile: 0.8
  min_train_ratings: 5

